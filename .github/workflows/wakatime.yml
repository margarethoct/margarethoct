name: WakaReadMe

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.WAKA_TOKEN }}
        env:
          GH_TOKEN: ${{ secrets.WAKA_TOKEN }}
